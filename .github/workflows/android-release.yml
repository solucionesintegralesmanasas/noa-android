name: Android APK Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Derivar version desde tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "apk_name=NOA-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Install dependencias
        run: npm ci

      - name: Sincronizar VITE_APP_VERSION con el tag
        run: |
          python3 - "${{ steps.ver.outputs.version }}" <<'PY'
          import re, sys
          version = sys.argv[1]
          p = ".env.production"
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn(r'^VITE_APP_VERSION=.*$', f'VITE_APP_VERSION="{version}"', s, flags=re.M)
          if n == 0:
              s2 = s.rstrip("\n") + f'\nVITE_APP_VERSION="{version}"\n'
          open(p, "w", encoding="utf-8").write(s2)
          print(f"VITE_APP_VERSION={version}")
          PY

      - name: Build web produccion
        run: npm run build -- --mode production

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Inyectar versionCode/versionName
        run: |
          python3 - "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.version_code }}" <<'PY'
          import re, sys
          version, code = sys.argv[1], sys.argv[2]
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'versionCode\s+\d+', f'versionCode {code}', s)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', s)
          open(p, "w", encoding="utf-8").write(s)
          print(f"versionName={version} versionCode={code}")
          PY

      - name: Restaurar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: Build APK release
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renombrar APK + checksum
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          DST="${{ steps.ver.outputs.apk_name }}"
          cp "$SRC" "$DST"
          sha256sum "$DST" > "$DST.sha256.txt"
          ls -lh "$DST" "$DST.sha256.txt"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: NOA ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.ver.outputs.apk_name }}
            ${{ steps.ver.outputs.apk_name }}.sha256.txt
