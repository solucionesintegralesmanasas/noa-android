name: Android APK Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        # cmdline-tools + platform 36 + build-tools (reemplaza action externa).
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm cmdtools.zip
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Derivar version desde tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=NOA-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Install dependencias
        run: npm ci

      - name: Sincronizar versiones con el tag
        run: |
          python3 - "${{ steps.ver.outputs.version }}" <<'PY'
          import json, re, sys
          version = sys.argv[1]
          # .env.production -> VITE_APP_VERSION (versión que la app reporta y compara)
          p = ".env.production"
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn(r'^VITE_APP_VERSION=.*$', f'VITE_APP_VERSION="{version}"', s, flags=re.M)
          if n == 0:
              s2 = s.rstrip("\n") + f'\nVITE_APP_VERSION="{version}"\n'
          open(p, "w", encoding="utf-8").write(s2)
          # package.json -> version (mantiene coherencia con el tag)
          pj = "package.json"
          data = json.load(open(pj, encoding="utf-8"))
          data["version"] = version
          json.dump(data, open(pj, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          open(pj, "a", encoding="utf-8").write("\n")
          print(f"VITE_APP_VERSION={version} package.json={version}")
          PY

      - name: Build web produccion
        run: npm run build -- --mode production

      - name: Verificar estilos empaquetados
        # Si falta el theme Falcon, FontAwesome o el index, el APK saldría
        # sin estilos: se falla aquí en vez de publicar un APK roto.
        run: |
          test -f dist/index.html || (echo "FALTA dist/index.html" && exit 1)
          test -f dist/assets/css/theme.min.css || (echo "FALTA dist/assets/css/theme.min.css" && exit 1)
          test -f dist/vendors/FontAwesome-pro/css/all.min.css || (echo "FALTA dist/vendors FontAwesome" && exit 1)
          test -f dist/assets/js/config.js || (echo "FALTA dist/assets/js/config.js" && exit 1)
          ls -lh dist/index.html dist/assets/css/theme.min.css dist/vendors/FontAwesome-pro/css/all.min.css
          echo "--- referencias en dist/index.html ---"
          grep -o 'href="[^"]*theme.min.css"' dist/index.html
          grep -o 'href="[^"]*all.min.css"' dist/index.html

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Inyectar versionCode/versionName
        # versionCode = actual de build.gradle + 1 (siempre creciente,
        # independiente de reintentos o corridas manuales del workflow).
        run: |
          python3 - "${{ steps.ver.outputs.version }}" <<'PY'
          import re, sys
          version = sys.argv[1]
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          current = int(re.search(r'versionCode\s+(\d+)', s).group(1))
          new_code = current + 1
          s = re.sub(r'versionCode\s+\d+', f'versionCode {new_code}', s)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', s)
          open(p, "w", encoding="utf-8").write(s)
          print(f"versionName={version} versionCode={new_code}")
          PY

      - name: Restaurar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: Build APK release
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renombrar APK + checksum
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          DST="${{ steps.ver.outputs.apk_name }}"
          cp "$SRC" "$DST"
          sha256sum "$DST" > "$DST.sha256.txt"
          ls -lh "$DST" "$DST.sha256.txt"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: NOA ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.ver.outputs.apk_name }}
            ${{ steps.ver.outputs.apk_name }}.sha256.txt
